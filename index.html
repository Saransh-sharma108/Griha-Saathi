<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Griha Saathi — Directing to Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FAF9F6;
      color: #19201C;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E1E6E2;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 620px;
      box-shadow: 0 16px 36px rgba(16, 38, 26, 0.1);
      text-align: center;
    }
    .icon {
      width: 62px;
      height: 62px;
      background: #EBF3EE;
      color: #1B4332;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 32px;
      box-shadow: 0 4px 12px rgba(27, 67, 50, 0.15);
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      color: #10261A;
      margin-bottom: 0.5rem;
      font-weight: 800;
    }
    p {
      font-size: 0.95rem;
      color: #3D4842;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background: #1B4332;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0.95rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(27, 67, 50, 0.25);
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2D6A4F;
    }
    .code-box {
      background: #19201C;
      color: #DCFCE7;
      font-family: Consolas, monospace;
      padding: 1.1rem 1.25rem;
      border-radius: 10px;
      text-align: left;
      font-size: 0.88rem;
      margin: 1.25rem 0;
      line-height: 1.7;
    }
    .status {
      font-size: 0.84rem;
      color: #15803D;
      margin-top: 0.6rem;
      font-weight: 600;
    }
  </style>
  <script>
    function checkServer() {
      var status = document.getElementById('status');
      fetch('http://localhost:3000/api/health')
        .then(function (res) {
          if (res.ok) {
            if (status) {
              status.innerText = '✅ Griha Saathi is running! Redirecting...';
              status.style.color = '#15803D';
            }
            window.location.replace('http://localhost:3000/' + window.location.hash);
          } else {
            setOffline();
          }
        })
        .catch(function () {
          setOffline();
        });
    }

    function setOffline() {
      var status = document.getElementById('status');
      if (status) {
        status.innerHTML = '⚠️ Server offline. Run <code>npm.cmd run dev</code> or launch <strong>start.cmd</strong>. Auto-reconnecting...';
        status.style.color = '#B45309';
      }
      setTimeout(checkServer, 2000);
    }

    window.addEventListener('DOMContentLoaded', checkServer);
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">🏠</div>
    <h1>Griha Saathi Platform</h1>
    <p>
      Griha Saathi is a full-stack React & TypeScript platform powered by the <strong>Vite development server</strong> on <code>http://localhost:3000</code>.
    </p>
    <a class="btn" href="http://localhost:3000/">👉 Open Griha Saathi on http://localhost:3000</a>
    <div id="status" class="status">Connecting to http://localhost:3000...</div>
    <div class="code-box">
      <div style="color: #91A098;"># Command to run both Frontend and API Backend:</div>
      <div style="color: #DCFCE7; font-weight: bold;">npm.cmd run dev</div>
    </div>
  </div>
</body>
</html>
